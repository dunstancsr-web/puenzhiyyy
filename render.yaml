# Render blueprint for StockSense.
# https://render.com/docs/blueprint-spec
#
# To deploy: push this file, then on Render choose New > Blueprint and point it
# at this repo. Everything below is picked up automatically, so there are no
# build or start commands to retype into a form.
#
# ── On persistence, which is the one real decision here ──────────────────────
# StockSense writes to a SQLite file. Render's free instance type does NOT
# support persistent disks, so this blueprint deliberately runs WITHOUT one:
# the container filesystem is ephemeral and the database resets whenever the
# instance restarts or redeploys.
#
# That is a sound trade for a judged demo rather than a compromise, because the
# seed is deterministic. backend/src/index.js seeds on first boot when the SKU
# table is empty, so a restarted instance comes back with exactly the same 10
# SKUs, 241 sales transactions and 4 open purchase orders. The only thing lost
# is state a visitor created themselves (their acknowledged alerts, their
# recorded decisions, their audit trail).
#
# To keep that state instead, upgrade the instance to a paid type and uncomment
# the `disk` block at the bottom. DATA_DIR already points at the mount path, so
# no code change is needed.
#
# Free instances also sleep after 15 minutes of inactivity and take roughly 50
# seconds to wake. Open the URL a minute before demoing it or before handing it
# to a judge.

services:
  - type: web
    name: stocksense
    runtime: node
    plan: free
    region: singapore
    branch: main

    # Both workspaces are installed, then the frontend is built into
    # frontend/dist. The backend serves that directory itself when
    # NODE_ENV=production, so this deploys as a single service on one origin
    # rather than as a separate static site plus API.
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend

    # Render restarts the instance if this stops returning 2xx. It is a plain
    # liveness check that touches no database state.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Pinned rather than left to drift. better-sqlite3 is a native module and
      # is compiled during install, so the Node major version is not an
      # incidental detail here.
      - key: NODE_VERSION
        value: "22"

      # Where stocksense.db lives. /var/data is Render's conventional mount
      # path. Without a disk attached this is just a directory in the
      # container's ephemeral filesystem, which is the intended default above.
      # backend/src/db/init.js creates it if it does not exist.
      - key: DATA_DIR
        value: /var/data

      # The deployed frontend is served from this same origin, so no cross
      # origin request happens in normal use. This value only matters if you
      # point a local Vite dev server at the deployed API.
      - key: CORS_ORIGIN
        value: http://localhost:5173

    # ── Persistent storage: uncomment together with a paid `plan` above ──────
    # disk:
    #   name: stocksense-data
    #   mountPath: /var/data
    #   sizeGB: 1
